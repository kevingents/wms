<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Geen verbinding — GENTS WMS</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f2;
        color: #0a1f33;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 1.5rem;
      }
      .kaart {
        max-width: 22rem;
        background: #fff;
        border: 1px solid #d4dde6;
        border-radius: 0.75rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
      p { font-size: 0.9rem; color: #3a4a5a; margin: 0 0 1rem; line-height: 1.5; }
      button {
        width: 100%;
        min-height: 3rem;
        border: 0;
        border-radius: 0.5rem;
        background: #0a1f33;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
      }
      svg { color: #b45309; }
    </style>
  </head>
  <body>
    <div class="kaart">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 2l20 20" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M2 8.8a15 15 0 0 1 4.2-2.5" />
        <path d="M22 8.8a15 15 0 0 0-6-3.3" />
        <path d="M12 20h.01" />
      </svg>
      <h1>Geen verbinding</h1>
      <p>
        De terminal kan het magazijnsysteem niet bereiken. Scans die je al gemaakt hebt
        staan veilig in de wachtrij en worden verstuurd zodra er weer verbinding is.
      </p>
      <button onclick="location.reload()">Opnieuw proberen</button>
    </div>
  </body>
</html>
